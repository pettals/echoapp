name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - windows
      draft_release:
        description: "Create a draft GitHub release"
        required: true
        default: true
        type: boolean

jobs:
  macos-signed-notarized:
    name: macOS signed and notarized build
    if: inputs.platform == 'macos'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate macOS release secrets
        run: |
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
            APPLE_SIGNING_IDENTITY
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify offline Meetings licence provisioning
        run: node -e "if (!Object.keys(require('./src-tauri/meeting-license-keys.json')).length) throw Error('Provision Meetings signing keys before release')"

      - name: Build universal Meetings helpers
        run: node scripts/build-meeting-helpers.mjs --universal --release

      - name: Build universal Bark helper
        run: node scripts/build-bark-helper.mjs --universal --release

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build signed and notarized macOS bundles
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles app,dmg --target universal-apple-darwin
          tagName: echo-v__VERSION__
          releaseName: Echo v__VERSION__
          releaseBody: |
            Draft macOS release for Pettal Technology QA.

            Verify on a clean macOS account before publishing.
          releaseDraft: ${{ inputs.draft_release }}
          prerelease: true

      - name: Verify bundled Bark helper and app signatures
        # tauri-action signs nested externalBin code before notarizing the app.
        # Verify the helper as well as the enclosing resource seal.
        run: |
          for app in src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app; do
            codesign --verify --deep --strict "$app"
            for helper in echo-bark echo-notes echo-capture; do
              codesign --verify --strict "$app/Contents/MacOS/$helper"
              helper_archs="$(lipo -archs "$app/Contents/MacOS/$helper")"
              [[ " $helper_archs " == *" arm64 "* ]]
              [[ " $helper_archs " == *" x86_64 "* ]]
            done
            bark_archs="$(lipo -archs "$app/Contents/MacOS/echo-bark")"
            [[ " $bark_archs " == *" arm64 "* ]]
            [[ " $bark_archs " == *" x86_64 "* ]]
          done

      - name: Upload macOS bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-macos-signed-notarized
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

  windows-release:
    name: Windows installer candidate
    if: inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Verify offline Meetings licence provisioning
        run: node -e "if (!Object.keys(require('./src-tauri/meeting-license-keys.json')).length) throw Error('Provision Meetings signing keys before release')"
      - name: Build native Meetings helpers
        run: node scripts/build-meeting-helpers.mjs --release
      - name: Check and test Rust
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo test --locked --lib
      - name: Build Windows installer candidate
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: echo-windows-installer-candidate
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # Publishing requires Windows signing and real-device QA recorded in MANUAL_QA.
      # This job uploads a candidate; it does not publish an unsigned installer.
